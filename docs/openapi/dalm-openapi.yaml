openapi: 3.1.0
info:
  title: DALM API
  version: 1.0.0
  summary: AI 사진 매칭 및 엽서 서비스 API
  description: |
    하루 한 장의 사진을 등록하면 AI가 최근 7일 내 다른 사용자의 사진에서
    닮은 순간을 찾고, 매칭된 사용자끼리 한 장의 엽서를 주고받는 서비스의 API입니다.

    ## 핵심 정책
    - 사용자당 하루 한 장의 활성 사진
    - 사진은 4:5 비율이며 등록 후 AI 적합성 검사를 수행
    - 통과한 사진은 최대 7일 동안 매칭 후보를 탐색
    - 한 사진은 최대 한 번만 매칭
    - 매칭당 각 사용자는 엽서를 최대 한 장만 발송
    - 정확한 위치, 연락처, 카카오 친구 목록은 수집하거나 공개하지 않음
servers:
  - url: http://localhost:8000/v1
    description: Local development
  - url: https://api.example.com/v1
    description: Production placeholder
tags:
  - name: Auth
    description: 카카오 로그인과 서비스 토큰
  - name: Users
    description: 온보딩, 프로필, 계정
  - name: Photos
    description: 오늘 사진 등록과 상태 관리
  - name: Moments
    description: 탐색 중·발견·지나간 순간
  - name: Matches
    description: 매칭 결과와 사용자별 표시 설정
  - name: Postcards
    description: 엽서 발송과 엽서함
  - name: Notifications
    description: 앱 내 알림과 푸시 설정
  - name: Safety
    description: 차단과 신고

paths:
  /auth/kakao:
    post:
      tags: [Auth]
      summary: 카카오 로그인
      operationId: loginWithKakao
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLoginRequest'
      responses:
        '200':
          description: 기존 회원 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '201':
          description: 신규 회원 인증 성공, 온보딩 필요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'
        '403':
          $ref: '#/components/responses/AccountRestricted'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Access Token 재발급
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 재발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/AuthenticationFailed'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      operationId: logout
      responses:
        '204':
          description: 로그아웃 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/onboarding:
    post:
      tags: [Users]
      summary: 약관 동의 및 신규 프로필 생성
      operationId: completeOnboarding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingRequest'
      responses:
        '201':
          description: 온보딩 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/NicknameConflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/me:
    get:
      tags: [Users]
      summary: 내 프로필 조회
      operationId: getMyProfile
      responses:
        '200':
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: 내 프로필 수정
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/NicknameConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: 회원 탈퇴
      description: 계정을 탈퇴 상태로 변경하고 개인정보 및 이미지 삭제 작업을 시작합니다.
      operationId: withdrawMyAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: boolean
                  const: true
      responses:
        '202':
          description: 탈퇴 처리 접수
        '422':
          $ref: '#/components/responses/ValidationError'

  /photos/today:
    get:
      tags: [Photos]
      summary: 오늘 활성 사진과 등록 가능 여부 조회
      operationId: getTodayPhoto
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayPhotoResponse'

  /photos:
    post:
      tags: [Photos]
      summary: 오늘 사진 등록 및 AI 적합성 검사 시작
      description: |
        Flutter에서 4:5 비율로 편집한 사진을 등록합니다. 서버는 파일을 검증하고
        EXIF GPS를 제거한 뒤 비공개 저장소에 저장하고 비동기 AI 검사를 시작합니다.
      operationId: createPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG 또는 WEBP 형식의 4:5 이미지
      responses:
        '202':
          description: 사진 등록 및 검사 작업 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePhotoResponse'
        '409':
          description: 오늘 활성 사진이 이미 존재함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                data: null
                error:
                  code: TODAY_PHOTO_ALREADY_EXISTS
                  message: 오늘 등록한 사진이 이미 있습니다.
                  request_id: 5727d107-d1b2-4873-aa61-19e76e595158
        '413':
          $ref: '#/components/responses/ImageTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedImageFormat'
        '422':
          $ref: '#/components/responses/ValidationError'

  /photos/{photo_id}:
    parameters:
      - $ref: '#/components/parameters/PhotoId'
    get:
      tags: [Photos]
      summary: 사진 상태 및 상세 조회
      operationId: getPhoto
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PhotoNotFound'
    delete:
      tags: [Photos]
      summary: 매칭 전 사진 삭제
      description: SEARCHING 또는 EXPIRED 사진만 삭제할 수 있습니다.
      operationId: deletePhoto
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/PhotoNotFound'
        '409':
          description: 현재 상태에서는 삭제할 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /moments:
    get:
      tags: [Moments]
      summary: 내 순간 목록 조회
      operationId: listMoments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MomentFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MomentListResponse'

  /matches/{match_id}:
    parameters:
      - $ref: '#/components/parameters/MatchId'
    get:
      tags: [Matches]
      summary: 매칭 결과 조회
      operationId: getMatch
      responses:
        '200':
          description: 매칭 결과 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/MatchNotFound'

  /matches/{match_id}/visibility:
    patch:
      tags: [Matches]
      summary: 내 순간에서 매칭 숨김 또는 복원
      operationId: updateMatchVisibility
      parameters:
        - $ref: '#/components/parameters/MatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden:
                  type: boolean
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchVisibilityResponse'
        '404':
          $ref: '#/components/responses/MatchNotFound'

  /matches/{match_id}/postcards:
    post:
      tags: [Postcards]
      summary: 매칭 상대에게 엽서 발송
      description: 매칭 참여자만 순서 정책에 따라 사용자별 한 번 발송할 수 있습니다.
      operationId: sendPostcard
      parameters:
        - $ref: '#/components/parameters/MatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPostcardRequest'
      responses:
        '201':
          description: 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcardResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 중복 발송, 발송 순서 위반 또는 차단 관계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /postcards/received:
    get:
      tags: [Postcards]
      summary: 받은 엽서 목록
      operationId: listReceivedPostcards
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcardListResponse'

  /postcards/sent:
    get:
      tags: [Postcards]
      summary: 보낸 엽서 목록
      operationId: listSentPostcards
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 목록 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcardListResponse'

  /postcards/{postcard_id}:
    parameters:
      - $ref: '#/components/parameters/PostcardId'
    get:
      tags: [Postcards]
      summary: 엽서 상세 조회
      operationId: getPostcard
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcardResponse'
        '404':
          $ref: '#/components/responses/PostcardNotFound'
    delete:
      tags: [Postcards]
      summary: 내 엽서함에서 엽서 삭제
      description: 상대방의 엽서함에는 영향을 주지 않습니다.
      operationId: deletePostcardFromMailbox
      responses:
        '204':
          description: 삭제 성공
        '404':
          $ref: '#/components/responses/PostcardNotFound'

  /postcards/{postcard_id}/read:
    patch:
      tags: [Postcards]
      summary: 받은 엽서 읽음 처리
      operationId: markPostcardRead
      parameters:
        - $ref: '#/components/parameters/PostcardId'
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostcardResponse'
        '404':
          $ref: '#/components/responses/PostcardNotFound'

  /notifications:
    get:
      tags: [Notifications]
      summary: 앱 내 알림 목록 조회
      operationId: listNotifications
      parameters:
        - name: unread_only
          in: query
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListResponse'

  /notifications/{notification_id}/read:
    patch:
      tags: [Notifications]
      summary: 알림 읽음 처리
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: 읽음 처리 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    patch:
      tags: [Notifications]
      summary: 모든 알림 읽음 처리
      operationId: markAllNotificationsRead
      responses:
        '204':
          description: 처리 성공

  /device-tokens:
    post:
      tags: [Notifications]
      summary: FCM 기기 토큰 등록 또는 갱신
      operationId: registerDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '204':
          description: 등록 성공

  /notification-settings:
    get:
      tags: [Notifications]
      summary: 알림 설정 조회
      operationId: getNotificationSettings
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'
    patch:
      tags: [Notifications]
      summary: 알림 설정 변경
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
      responses:
        '200':
          description: 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettingsResponse'

  /blocks:
    get:
      tags: [Safety]
      summary: 차단 사용자 목록
      operationId: listBlockedUsers
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUserListResponse'

  /blocks/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Safety]
      summary: 사용자 차단
      operationId: blockUser
      responses:
        '204':
          description: 차단 성공
        '409':
          description: 본인 차단 또는 이미 차단함
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Safety]
      summary: 사용자 차단 해제
      operationId: unblockUser
      responses:
        '204':
          description: 해제 성공

  /reports:
    post:
      tags: [Safety]
      summary: 사진, 엽서 또는 사용자 신고
      description: 신고가 접수되면 신고자 화면에서 대상 콘텐츠를 즉시 숨깁니다.
      operationId: createReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: 신고 접수 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PhotoId:
      name: photo_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchId:
      name: match_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PostcardId:
      name: postcard_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: 이전 응답의 next_cursor
    PageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 모바일 네트워크 재시도 시 중복 생성을 막는 UUID
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: 인증이 필요하거나 토큰이 만료됨
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationFailed:
      description: 카카오 인증 또는 Refresh Token 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountRestricted:
      description: 이용 제한 계정
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 리소스 접근 권한 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PhotoNotFound:
      description: 사진을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MatchNotFound:
      description: 매칭을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PostcardNotFound:
      description: 엽서를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NicknameConflict:
      description: 사용 중인 닉네임
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ImageTooLarge:
      description: 이미지 최대 용량 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedImageFormat:
      description: 지원하지 않는 이미지 형식
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 요청값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    KakaoLoginRequest:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          minLength: 1
          description: 카카오 SDK에서 발급받은 Access Token

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1

    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Access Token 유효 시간(초)

    AuthData:
      type: object
      required: [is_new_user, onboarding_required, tokens]
      properties:
        is_new_user:
          type: boolean
        onboarding_required:
          type: boolean
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AuthData'

    TokenResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenPair'

    OnboardingRequest:
      type: object
      required:
        - nickname
        - service_terms_agreed
        - privacy_policy_agreed
        - age_14_confirmed
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 12
        bio:
          type: string
          maxLength: 100
        profile_image:
          type: string
          format: binary
        service_terms_agreed:
          type: boolean
          const: true
        privacy_policy_agreed:
          type: boolean
          const: true
        age_14_confirmed:
          type: boolean
          const: true
        marketing_agreed:
          type: boolean
          default: false
        service_terms_version:
          type: string
        privacy_policy_version:
          type: string

    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 12
        bio:
          type: string
          maxLength: 100
        profile_image:
          type: string
          format: binary
        remove_profile_image:
          type: boolean

    User:
      type: object
      required: [id, nickname, status, stats, created_at]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        profile_image_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        bio:
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: string
          enum: [ACTIVE, RESTRICTED]
        stats:
          $ref: '#/components/schemas/UserStats'
        created_at:
          type: string
          format: date-time

    UserStats:
      type: object
      required: [photo_count, match_count, received_postcard_count]
      properties:
        photo_count:
          type: integer
          minimum: 0
        match_count:
          type: integer
          minimum: 0
        received_postcard_count:
          type: integer
          minimum: 0

    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/User'

    PhotoStatus:
      type: string
      enum: [VALIDATING, REJECTED, SEARCHING, MATCHED, EXPIRED, DELETED]

    Photo:
      type: object
      required: [id, status, image_url, registered_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PhotoStatus'
        image_url:
          type: string
          format: uri
          description: 만료 시간이 있는 서명 URL
        thumbnail_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        ai_title:
          oneOf:
            - type: string
            - type: 'null'
        registered_at:
          type: string
          format: date-time
        search_expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        remaining_days:
          oneOf:
            - type: integer
              minimum: 0
              maximum: 7
            - type: 'null'
        rejection:
          oneOf:
            - $ref: '#/components/schemas/PhotoRejection'
            - type: 'null'
        match_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'

    PhotoRejection:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - TOO_BLURRY
            - TOO_DARK
            - SCREENSHOT
            - TEXT_DOMINANT
            - QR_OR_BARCODE
            - SENSITIVE_INFORMATION
            - SEXUAL_OR_VIOLENT
            - ADVERTISEMENT
            - DUPLICATE_PHOTO
        message:
          type: string

    CreatePhotoData:
      type: object
      required: [photo_id, status, registered_at]
      properties:
        photo_id:
          type: string
          format: uuid
        status:
          type: string
          const: VALIDATING
        registered_at:
          type: string
          format: date-time

    CreatePhotoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CreatePhotoData'

    PhotoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Photo'

    TodayPhotoData:
      type: object
      required: [can_register]
      properties:
        can_register:
          type: boolean
        photo:
          oneOf:
            - $ref: '#/components/schemas/Photo'
            - type: 'null'

    TodayPhotoResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TodayPhotoData'

    MomentFilter:
      type: string
      enum: [ALL, SEARCHING, MATCHED, EXPIRED, HIDDEN]
      default: ALL

    Moment:
      type: object
      required: [photo, category]
      properties:
        category:
          $ref: '#/components/schemas/MomentFilter'
        photo:
          $ref: '#/components/schemas/Photo'
        match_summary:
          oneOf:
            - $ref: '#/components/schemas/MatchSummary'
            - type: 'null'

    MatchSummary:
      type: object
      required: [id, matched_at, postcard_state]
      properties:
        id:
          type: string
          format: uuid
        matched_at:
          type: string
          format: date-time
        postcard_state:
          type: string
          enum: [CAN_WRITE, WAITING_FOR_FIRST, SENT, NEW_RECEIVED, COMPLETED]

    MomentListData:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Moment'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_next:
          type: boolean

    MomentListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MomentListData'

    Match:
      type: object
      required:
        - id
        - my_photo
        - partner_photo
        - explanation
        - matched_at
        - postcard_permission
      properties:
        id:
          type: string
          format: uuid
        my_photo:
          $ref: '#/components/schemas/MatchedPhoto'
        partner_photo:
          $ref: '#/components/schemas/MatchedPhoto'
        partner:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
        explanation:
          type: string
        matched_at:
          type: string
          format: date-time
        hidden:
          type: boolean
          default: false
        postcard_permission:
          type: string
          enum: [CAN_SEND, WAITING_FOR_FIRST, ALREADY_SENT, BLOCKED]

    MatchedPhoto:
      type: object
      required: [id, image_url, registered_at]
      properties:
        id:
          type: string
          format: uuid
        image_url:
          type: string
          format: uri
        registered_at:
          type: string
          format: date-time
        deleted:
          type: boolean
          default: false

    PublicUser:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: string
          format: uuid
        nickname:
          type: string
        profile_image_url:
          oneOf:
            - type: string
              format: uri
            - type: 'null'

    MatchResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Match'

    MatchVisibilityResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              required: [match_id, hidden]
              properties:
                match_id:
                  type: string
                  format: uuid
                hidden:
                  type: boolean

    SendPostcardRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
          description: 공백만 입력할 수 없음

    Postcard:
      type: object
      required: [id, match_id, sender, receiver, content, sent_at, is_read]
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        sender:
          $ref: '#/components/schemas/PublicUser'
        receiver:
          $ref: '#/components/schemas/PublicUser'
        content:
          type: string
          minLength: 1
          maxLength: 200
        is_read:
          type: boolean
        read_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        sent_at:
          type: string
          format: date-time
        moment_thumbnail_url:
          type: string
          format: uri

    PostcardResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Postcard'

    PostcardListData:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Postcard'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_next:
          type: boolean

    PostcardListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PostcardListData'

    NotificationType:
      type: string
      enum:
        - VALIDATION_PASSED
        - PHOTO_REJECTED
        - MATCHED
        - POSTCARD_RECEIVED
        - SEARCH_EXPIRED
        - SYSTEM

    Notification:
      type: object
      required: [id, type, title, message, is_read, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        message:
          type: string
        target_type:
          oneOf:
            - type: string
              enum: [PHOTO, MATCH, POSTCARD, SYSTEM]
            - type: 'null'
        target_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    NotificationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Notification'

    NotificationListData:
      type: object
      required: [items, unread_count, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        unread_count:
          type: integer
          minimum: 0
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_next:
          type: boolean

    NotificationListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NotificationListData'

    DeviceTokenRequest:
      type: object
      required: [token, platform]
      properties:
        token:
          type: string
          minLength: 1
        platform:
          type: string
          enum: [IOS, ANDROID]

    NotificationSettings:
      type: object
      properties:
        validation_enabled:
          type: boolean
        match_enabled:
          type: boolean
        postcard_enabled:
          type: boolean
        search_expired_enabled:
          type: boolean
        system_enabled:
          type: boolean

    NotificationSettingsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/NotificationSettings'

    BlockedUser:
      type: object
      required: [user, blocked_at]
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        blocked_at:
          type: string
          format: date-time

    BlockedUserListData:
      type: object
      required: [items, has_next]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BlockedUser'
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
        has_next:
          type: boolean

    BlockedUserListResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BlockedUserListData'

    CreateReportRequest:
      type: object
      required: [target_type, target_id, reason_code]
      properties:
        target_type:
          type: string
          enum: [PHOTO, POSTCARD, USER]
        target_id:
          type: string
          format: uuid
        reason_code:
          type: string
          enum:
            - INAPPROPRIATE_PHOTO
            - SEXUAL_OR_VIOLENT
            - HATE_OR_DISCRIMINATION
            - PERSONAL_INFORMATION
            - ADVERTISEMENT
            - OFFENSIVE_POSTCARD
            - OTHER
        detail:
          type: string
          maxLength: 1000

    Report:
      type: object
      required: [id, target_type, target_id, reason_code, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        target_type:
          type: string
          enum: [PHOTO, POSTCARD, USER]
        target_id:
          type: string
          format: uuid
        reason_code:
          type: string
        status:
          type: string
          enum: [PENDING, REVIEWING, RESOLVED, REJECTED]
        created_at:
          type: string
          format: date-time

    ReportResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Report'

    SuccessEnvelope:
      type: object
      required: [data, error]
      properties:
        data: {}
        error:
          type: 'null'

    ErrorDetail:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        fields:
          type: array
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
              reason:
                type: string

    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorDetail'

security:
  - bearerAuth: []
