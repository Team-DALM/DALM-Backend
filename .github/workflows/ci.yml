name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check app tests alembic scripts deploy/aws

      - name: Pytest
        env:
          DALM_JWT_SECRET: ci-secret-that-is-at-least-32-characters
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q app alembic tests scripts

      - name: Validate Alembic migrations
        env:
          DALM_DATABASE_URL: postgresql+asyncpg://dalm:dalm@localhost:5432/dalm
        run: alembic upgrade head --sql > /tmp/dalm-migration.sql

      - name: Validate Docker Compose
        env:
          DALM_JWT_SECRET: ci-secret-that-is-at-least-32-characters
        run: |
          docker compose config --quiet
          cp deploy/aws/.env.example deploy/aws/.env
          trap 'rm -f deploy/aws/.env' EXIT
          docker compose --env-file deploy/aws/.env -f deploy/aws/compose.yaml config --quiet
          docker compose -f deploy/aws/postgres/compose.yaml config --quiet
          bash -n deploy/aws/deploy.sh
          python -m py_compile deploy/aws/auto_deploy.py deploy/aws/backup.py deploy/aws/migrate_postgres.py
          bash -n deploy/aws/install-ops.sh
          docker run --rm --add-host api:127.0.0.1 -v "$PWD/deploy/aws/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

  container:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build production image
        run: |
          docker build --tag dalm-api:${{ github.sha }} .
          docker run --rm --entrypoint python dalm-api:${{ github.sha }} -m scripts.run_photo_validation_worker --help
