[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dalm-backend"
version = "0.1.0"
description = "DALM FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pyjwt>=2.9,<3",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

