name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check app tests alembic

      - name: Pytest
        env:
          DALM_JWT_SECRET: ci-secret-that-is-at-least-32-characters
        run: pytest -q

      - name: Validate Docker Compose
        env:
          DALM_JWT_SECRET: ci-secret-that-is-at-least-32-characters
        run: docker compose config --quiet

