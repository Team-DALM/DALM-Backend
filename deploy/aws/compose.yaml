name: dalm-aws

x-app: &app
  image: dalm-api:${DALM_IMAGE_TAG:?Set a commit SHA as DALM_IMAGE_TAG}
  build:
    context: ../..
  env_file: .env
  environment:
    DALM_REDIS_URL: ${DALM_REDIS_URL:-redis://redis:6379/0}
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    profiles: [tools]

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  redis_data:
